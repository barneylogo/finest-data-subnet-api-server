# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["subnet_api_server/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

# ==== Ruff ====
[tool.ruff]
target-version = "py310"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

select = [
  "F", "E", "W", "C90", "I", "N", "S", "BLE", "FBT", "B", "A", "COM",
  "C4", "DTZ", "T10", "DJ", "EM", "EXE",
  "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI",
  "PT", "Q", "RSE", "RET", "SLF", "SIM",
  "TID", "TCH", "INT", "PTH", "ERA", "PD", "PGH",
  "PL", "TRY",   "RUF",
]
ignore = [
  "S101",    # Use of assert detected
  "SIM102",  # Sometimes it's better to nest
  "UP038",   # Checks for uses of isinstance/issubclass that take a tuple
  "BLE001",  # Ignore blind exception catching
  "S113",    # Ignore requests without timeouts
  "DTZ007",  # Ignore naive datetime construction without timezone
  "TRY300",  # Ignore suggestions to move return statements to an `else` block
]

[tool.ruff.isort]
force-single-line = true
